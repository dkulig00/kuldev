services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kuldev
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kuldev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuldev"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
